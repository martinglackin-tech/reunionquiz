<!DOCTYPE html>
<html lang="en" class="h-full bg-[#fbfbfa]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rugby Avenue — 27 Years Later</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['Newsreader', 'Playfair Display', 'Georgia', 'serif'],
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
            },
            colors: {
              warm: {
                50: '#faf8f5',
                100: '#f5f0ea',
                200: '#e8ded2',
                300: '#d7c7b5',
                800: '#3c342c',
                900: '#231e19',
              }
            }
          }
        }
      }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <style>
        /* Smooth card fade transitions */
        .card-transition {
            transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .card-enter {
            opacity: 1;
            transform: translateX(0) scale(1);
        }
        .card-exit-left {
            opacity: 0;
            transform: translateX(-24px) scale(0.98);
            pointer-events: none;
        }
        .card-exit-right {
            opacity: 0;
            transform: translateX(24px) scale(0.98);
            pointer-events: none;
        }
        /* Custom subtle scrollbar */
        textarea::-webkit-scrollbar {
            width: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #e2ded8;
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-full font-sans text-stone-800 bg-[#fbfbfa] flex flex-col justify-between selection:bg-stone-200 selection:text-stone-900 antialiased overflow-x-hidden">

    <!-- TOP MINIMAL NAV / BRAND (Ultra unobtrusive) -->
    <header class="w-full max-w-lg mx-auto px-6 pt-6 pb-2 flex items-center justify-between text-stone-400">
        <button onclick="window.goToCard(0)" class="text-xs uppercase tracking-widest font-semibold hover:text-stone-700 transition flex items-center gap-1.5" title="Home">
            <span class="w-2 h-2 rounded-full bg-stone-300"></span>
            <span>Rugby Ave</span>
        </button>

        <div id="user-indicator" class="text-xs font-medium text-stone-500 hidden">
            <!-- Dynamically populated with active name -->
        </div>
    </header>

    <!-- MAIN APP VIEWPORT (Card Stage) -->
    <main class="flex-1 max-w-lg w-full mx-auto px-4 py-2 flex flex-col justify-center relative">
        <div id="card-stage" class="w-full">
            <!-- CARDS ARE DYNAMICALLY RENDERED HERE -->
        </div>
    </main>

    <!-- SUBTLE MINIMAL FOOTER -->
    <footer class="w-full max-w-lg mx-auto px-6 py-4 text-center">
        <p class="text-[11px] text-stone-400 font-light">1999 — 2026 • 27 Years Later</p>
    </footer>

    <!-- APPLICATION LOGIC & FIREBASE SYNC -->
    <script type="module">
        // 1. Firebase SDK Modular Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            setDoc, 
            deleteDoc,
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { 
            getAuth, 
            signInAnonymously, 
            signInWithCustomToken, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // 2. Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDd_pefUa4e-r8JqLHPfL_ybw-0xJ0UVt4",
            authDomain: "reunionquiz.firebaseapp.com",
            projectId: "reunionquiz",
            storageBucket: "reunionquiz.firebasestorage.app",
            messagingSenderId: "176867995748",
            appId: "1:176867995748:web:089f40578be12e4d0d6f71",
            measurementId: "G-1J8E5TQG72"
        };

        // 3. Initialize Firebase & Services
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'rugby-avenue-reunion-minimal';

        // Constants
        const SECRET_PIN = "1999";
        const FRIENDS = ['Adele', 'Anne', 'Camille', 'Martin'];

        // Q4 Target Rotation so everyone describes someone ahead of time
        const Q4_ASSIGNMENTS = {
            'Adele': 'Anne',
            'Anne': 'Camille',
            'Camille': 'Martin',
            'Martin': 'Adele'
        };

        const BASE_QUESTIONS = [
            { id: 'q1', title: 'What advice would you give to your 19 year old self?' },
            { id: 'q2', title: 'What is a moment from our Rugby Avenue days that you will never forget?' },
            { id: 'q3', title: 'What song reminds you of Rugby Avenue?' },
            { id: 'q4', title: 'What 3 words would you use to describe [Friend]?' },
            { id: 'q5', title: 'Which place in the world do you want to see before you die?' },
            { id: 'q6', title: 'What would your 19 year old self think of your mid 40s self?' },
            { id: 'q7', title: 'How do you feel about getting older?' },
            { id: 'q8', title: 'Tell us about a memorable moment from a post-Rugby Avenue house you shared with one of us.' }
        ];

        // State
        let currentUser = null;
        let selectedName = localStorage.getItem('reunion_name') || '';
        let currentCardIndex = 0; // 0=Name, 1..8=Questions, 9=Thank you, 10=PIN, 11=Unlocked, 12=Admin
        let myAnswers = {};
        let allResponses = [];
        let isGloballyUnlocked = localStorage.getItem('reunion_unlocked') === 'true';
        let saveDebounceTimer = null;

        // View Mode inside Unlocked card: 'story' (one slide at a time) or 'digest' (clean list)
        let unlockedViewMode = 'story';
        let unlockedStoryIdx = 0;

        // Swipe Gesture Tracking
        let touchStartX = 0;
        let touchStartY = 0;

        // --- DEVICE IDENTITY ---
        // Generates a unique footprint for the browser so we know who "owns" a name
        let localDeviceId = localStorage.getItem('reunion_device_id');
        if (!localDeviceId) {
            localDeviceId = Math.random().toString(36).substring(2, 15);
            localStorage.setItem('reunion_device_id', localDeviceId);
        }

        // --- AUTHENTICATION ---
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth init error:", err);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                subscribeToResponses();
                subscribeToGlobalSettings();
            }
        });

        // --- FIRESTORE SYNC ---
        function getResponsesCollectionRef() {
            return collection(db, 'artifacts', appId, 'public', 'data', 'reunion_responses');
        }

        function getSettingsDocRef() {
            return doc(db, 'artifacts', appId, 'public', 'data', 'reunion_settings', 'global');
        }

        function subscribeToResponses() {
            if (!currentUser) return;
            onSnapshot(getResponsesCollectionRef(), (snapshot) => {
                allResponses = [];
                snapshot.forEach(docSnap => {
                    allResponses.push(docSnap.data());
                });

                if (selectedName) {
                    const found = allResponses.find(r => r.name === selectedName);
                    // Only sync cloud answers down to local memory IF the device ID matches OR the app is unlocked
                    if (found && found.answers && (!found.deviceId || found.deviceId === localDeviceId || isGloballyUnlocked)) {
                        myAnswers = { ...found.answers, ...myAnswers }; 
                    }
                }

                // Auto-refresh dynamic screens if they are currently visible
                if (currentCardIndex === 0 || currentCardIndex === 11 || currentCardIndex === 12) {
                    renderCurrentCard();
                }
            }, (err) => {
                console.error("Firestore read error:", err);
            });
        }

        function subscribeToGlobalSettings() {
            if (!currentUser) return;
            onSnapshot(getSettingsDocRef(), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.unlocked !== undefined) {
                        isGloballyUnlocked = data.unlocked;
                        localStorage.setItem('reunion_unlocked', isGloballyUnlocked ? 'true' : 'false');
                        // Auto-kick out of unlocked view if an admin relocks the app
                        if (!isGloballyUnlocked && (currentCardIndex === 11 || currentCardIndex === 12)) {
                            currentCardIndex = 0;
                            renderCurrentCard();
                        }
                    }
                }
            }, (err) => console.error(err));
        }

        async function saveMyAnswersToCloud() {
            if (!currentUser || !selectedName) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'reunion_responses', selectedName.toLowerCase());
                await setDoc(docRef, {
                    name: selectedName,
                    deviceId: localDeviceId, // Tag answers with this device
                    answers: myAnswers,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
            } catch (e) {
                console.error("Save error:", e);
            }
        }

        async function triggerGlobalUnlock() {
            try {
                await setDoc(getSettingsDocRef(), { unlocked: true }, { merge: true });
                isGloballyUnlocked = true;
                localStorage.setItem('reunion_unlocked', 'true');
            } catch (e) {
                console.error("Unlock error:", e);
            }
        }

        // --- ADMIN CAPABILITIES ---
        window.goToAdmin = function() {
            currentCardIndex = 12;
            renderCurrentCard();
        };

        window.wipeUser = async function(name) {
            if(!confirm(`Are you sure you want to wipe ${name}'s answers and unlock their profile?`)) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'reunion_responses', name.toLowerCase());
                await deleteDoc(docRef);
                
                // If the admin wiped themselves by accident, reset their local state
                if (selectedName === name) {
                    selectedName = '';
                    myAnswers = {};
                    localStorage.removeItem('reunion_name');
                }
            } catch(e) {
                console.error("Wipe error", e);
            }
        };

        window.relockReunion = async function() {
            if(!confirm("This will lock the app for everyone and return you to the start screen. Continue?")) return;
            try {
                await setDoc(getSettingsDocRef(), { unlocked: false }, { merge: true });
                // Note: The onSnapshot listener will catch this and kick the user out automatically
            } catch(e) {
                console.error("Relock error", e);
            }
        };

        // --- DYNAMIC QUESTION GENERATOR ---
        function getQuestionData(idx) {
            const base = BASE_QUESTIONS[idx];
            if (base.id === 'q4') {
                const target = Q4_ASSIGNMENTS[selectedName] || 'the person to your left';
                return {
                    id: 'q4',
                    title: `What 3 words would you use to describe ${target}?`,
                    targetFriend: target
                };
            }
            return base;
        }

        // --- CARD NAVIGATION & RENDERING ---
        window.goToCard = function(targetIdx) {
            saveCurrentInput();
            currentCardIndex = targetIdx;
            renderCurrentCard();
        };

        window.nextCard = function() {
            saveCurrentInput();
            saveMyAnswersToCloud();

            if (currentCardIndex >= 1 && currentCardIndex <= 7) {
                currentCardIndex++;
                renderCurrentCard();
            } else if (currentCardIndex === 8) {
                window.handleSubmitAnswers();
            }
        };

        window.prevCard = function() {
            saveCurrentInput();
            saveMyAnswersToCloud();

            if (currentCardIndex > 1) {
                currentCardIndex--;
                renderCurrentCard();
            } else if (currentCardIndex === 1) {
                currentCardIndex = 0;
                renderCurrentCard();
            }
        };

        function saveCurrentInput() {
            const textarea = document.getElementById('card-answer-input');
            if (textarea && currentCardIndex >= 1 && currentCardIndex <= 8) {
                const qId = BASE_QUESTIONS[currentCardIndex - 1].id;
                myAnswers[qId] = textarea.value.trim();
            }
        }

        window.selectName = function(name) {
            const existing = allResponses.find(r => r.name === name);
            
            // SECURITY: Prevent entering if claimed by another device (unless global PIN was entered)
            if (existing && existing.deviceId && existing.deviceId !== localDeviceId && !isGloballyUnlocked) {
                return;
            }

            selectedName = name;
            localStorage.setItem('reunion_name', name);
            
            // Clear local memory so previous user's answers don't bleed over
            myAnswers = {};
            
            // Copy cloud answers if they belong to this device or app is globally unlocked
            if (existing && existing.answers && (!existing.deviceId || existing.deviceId === localDeviceId || isGloballyUnlocked)) {
                myAnswers = JSON.parse(JSON.stringify(existing.answers));
            }

            // Visual feedback
            const btn = document.getElementById(`name-btn-${name}`);
            if (btn) {
                btn.classList.add('ring-2', 'ring-stone-900', 'bg-stone-900', 'text-white');
            }

            setTimeout(() => {
                currentCardIndex = 1;
                saveMyAnswersToCloud(); // Immediately claim the identity on the cloud
                renderCurrentCard();
            }, 180);
        };

        window.handleSubmitAnswers = function() {
            saveCurrentInput();
            saveMyAnswersToCloud();
            currentCardIndex = 9;
            renderCurrentCard();
            triggerConfetti();
        };

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 70,
                    spread: 60,
                    origin: { y: 0.65 },
                    colors: ['#e07a5f', '#3d405b', '#81b29a', '#f2cc8f']
                });
            }
        }

        // --- RENDER CARD ROUTER ---
        function renderCurrentCard() {
            const stage = document.getElementById('card-stage');
            const userIndicator = document.getElementById('user-indicator');

            if (selectedName && currentCardIndex > 0 && currentCardIndex <= 9) {
                userIndicator.classList.remove('hidden');
                userIndicator.innerHTML = `<span>${selectedName}</span> <span class="text-stone-300 mx-1">•</span> <span class="text-stone-400">${currentCardIndex <= 8 ? `${currentCardIndex}/8` : 'Complete'}</span>`;
            } else {
                userIndicator.classList.add('hidden');
            }

            // CARD 0: LANDING / NAME SELECTION
            if (currentCardIndex === 0) {
                stage.innerHTML = `
                    <div class="bg-white rounded-3xl p-7 sm:p-9 shadow-sm border border-stone-200/70 card-transition card-enter text-center">
                        <span class="inline-block text-[11px] font-semibold tracking-wider uppercase text-stone-400 mb-2">Reunion 2026</span>
                        <h1 class="text-2xl sm:text-3xl font-serif font-medium text-stone-900 mb-2 tracking-tight">Who is answering?</h1>
                        <p class="text-xs text-stone-500 mb-8 max-w-xs mx-auto">Select your name to begin.</p>

                        <div class="grid grid-cols-2 gap-3 max-w-xs mx-auto mb-4">
                            ${FRIENDS.map(name => {
                                const existing = allResponses.find(r => r.name === name);
                                const isClaimedByOther = existing && existing.deviceId && existing.deviceId !== localDeviceId;
                                const isLocked = isClaimedByOther && !isGloballyUnlocked;
                                
                                return `
                                    <button 
                                        id="name-btn-${name}"
                                        onclick="${isLocked ? '' : `window.selectName('${name}')`}"
                                        class="py-4 px-3 rounded-2xl border text-sm transition-all ${isLocked ? 'opacity-50 cursor-not-allowed bg-stone-50 text-stone-400 border-stone-100 font-medium' : (selectedName === name ? 'border-stone-900 bg-stone-900 text-white font-semibold shadow-md active:scale-95' : 'border-stone-200 hover:border-stone-300 bg-white font-medium text-stone-800 shadow-sm active:scale-95')}"
                                    >
                                        <div class="flex items-center justify-center gap-1.5">
                                            <span>${name}</span>
                                            ${isLocked ? '<span class="text-[10px]">🔒</span>' : ''}
                                        </div>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
                return;
            }

            // CARDS 1 to 8: QUESTION CARDS
            if (currentCardIndex >= 1 && currentCardIndex <= 8) {
                const qIdx = currentCardIndex - 1;
                const q = getQuestionData(qIdx);
                const currentAnswer = myAnswers[q.id] || '';
                const isLast = currentCardIndex === 8;

                stage.innerHTML = `
                    <div id="touch-card" class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-stone-200/70 card-transition card-enter flex flex-col justify-between min-h-[430px]">
                        <div>
                            <div class="flex items-center justify-between mb-5">
                                <span class="text-[11px] font-semibold tracking-wider uppercase text-stone-400">Question ${currentCardIndex} of 8</span>
                                <span class="text-[11px] text-stone-400 font-medium">Swipe enabled</span>
                            </div>

                            <h2 class="text-xl sm:text-2xl font-serif font-medium text-stone-900 leading-snug tracking-tight mb-5">
                                ${q.title}
                            </h2>

                            <div class="relative">
                                <textarea 
                                    id="card-answer-input"
                                    rows="5"
                                    placeholder="Write your thoughts..."
                                    class="w-full bg-stone-50/70 border border-stone-200 rounded-2xl p-4 text-stone-800 placeholder-stone-400 focus:outline-none focus:bg-white focus:border-stone-400 focus:ring-1 focus:ring-stone-300 transition text-sm sm:text-base leading-relaxed resize-none"
                                >${escapeHtml(currentAnswer)}</textarea>
                            </div>
                        </div>

                        <div class="flex items-center justify-between pt-5 mt-4 border-t border-stone-100">
                            <button onclick="window.prevCard()" class="text-xs font-semibold text-stone-500 hover:text-stone-800 px-3 py-2.5 rounded-xl transition active:scale-95">Back</button>
                            <button onclick="window.nextCard()" class="px-6 py-2.5 rounded-full ${isLast ? 'bg-stone-900 hover:bg-stone-800 text-white font-semibold' : 'bg-stone-900 hover:bg-stone-800 text-white font-medium'} text-xs sm:text-sm tracking-tight transition-all active:scale-95 shadow-xs">
                                ${isLast ? 'Submit Answers' : 'Next'}
                            </button>
                        </div>
                    </div>
                `;

                const textarea = document.getElementById('card-answer-input');
                if (textarea) {
                    textarea.addEventListener('input', () => {
                        myAnswers[q.id] = textarea.value.trim();
                        clearTimeout(saveDebounceTimer);
                        saveDebounceTimer = setTimeout(() => saveMyAnswersToCloud(), 800);
                    });
                }

                attachCardSwipeListener();
                return;
            }

            // CARD 9: THANK YOU
            if (currentCardIndex === 9) {
                stage.innerHTML = `
                    <div class="bg-white rounded-3xl p-8 sm:p-10 shadow-sm border border-stone-200/70 card-transition card-enter text-center">
                        <div class="w-12 h-12 bg-stone-100 text-stone-800 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">✓</div>
                        <span class="inline-block text-[11px] font-semibold tracking-wider uppercase text-stone-400 mb-1">Submitted</span>
                        <h2 class="text-2xl sm:text-3xl font-serif font-medium text-stone-900 mb-2 tracking-tight">Thank you, ${selectedName}!</h2>
                        <p class="text-xs sm:text-sm text-stone-500 mb-8 max-w-xs mx-auto leading-relaxed">
                            Your answers are saved. When everyone is ready, enter the secret PIN to reveal all group answers.
                        </p>
                        <div class="space-y-2.5 max-w-xs mx-auto">
                            <button onclick="window.goToCard(10)" class="w-full py-3.5 px-4 rounded-2xl bg-stone-900 hover:bg-stone-800 text-white text-xs font-semibold tracking-wide uppercase transition active:scale-95 shadow-xs">Secret PIN</button>
                            <button onclick="window.goToCard(1)" class="w-full py-2.5 px-4 text-xs font-medium text-stone-400 hover:text-stone-700 transition">Review my answers</button>
                        </div>
                    </div>
                `;
                return;
            }

            // CARD 10: PIN ENTRY
            if (currentCardIndex === 10) {
                stage.innerHTML = `
                    <div class="bg-white rounded-3xl p-7 sm:p-9 shadow-sm border border-stone-200/70 card-transition card-enter text-center max-w-sm mx-auto">
                        <span class="inline-block text-[11px] font-semibold tracking-wider uppercase text-stone-400 mb-1">Reunion PIN</span>
                        <h2 class="text-xl font-serif font-medium text-stone-900 mb-2">Enter Secret PIN</h2>
                        <p class="text-xs text-stone-500 mb-6">Enter the 4-digit reunion passcode to unlock all answers.</p>
                        <form onsubmit="window.handlePinSubmit(event)" class="space-y-4">
                            <input type="password" id="pin-field" maxlength="4" pattern="[0-9]*" inputmode="numeric" placeholder="••••" autofocus class="w-40 mx-auto text-center text-2xl tracking-[0.5em] font-mono bg-stone-50 border border-stone-300 rounded-xl py-3 text-stone-900 focus:outline-none focus:border-stone-900 transition">
                            <div id="pin-error" class="text-xs text-rose-600 font-medium hidden">Incorrect PIN. Please try again.</div>
                            <div class="flex items-center justify-between pt-4 border-t border-stone-100 gap-2">
                                <button type="button" onclick="window.goToCard(0)" class="text-xs font-semibold text-stone-500 hover:text-stone-800 px-3 py-2 transition">Home</button>
                                <button type="submit" class="px-5 py-2.5 rounded-full bg-stone-900 hover:bg-stone-800 text-white text-xs font-semibold tracking-tight transition active:scale-95 shadow-xs">Unlock Group Answers</button>
                            </div>
                        </form>
                    </div>
                `;
                setTimeout(() => { const el = document.getElementById('pin-field'); if (el) el.focus(); }, 100);
                return;
            }

            // CARD 11: UNLOCKED ANSWERS DECK
            if (currentCardIndex === 11) {
                renderUnlockedFeed();
                return;
            }

            // CARD 12: ADMIN PANEL
            if (currentCardIndex === 12) {
                stage.innerHTML = `
                    <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-stone-200/70 card-transition card-enter text-left">
                        <div class="flex items-center justify-between mb-6 pb-4 border-b border-stone-100">
                            <h2 class="text-xl font-serif font-medium text-stone-900">Admin Controls</h2>
                            <div class="flex gap-2">
                                <button onclick="window.goToCard(0)" class="text-[11px] font-semibold bg-stone-50 hover:bg-stone-100 text-stone-600 px-3 py-1.5 rounded-full transition">Home</button>
                                <button onclick="window.goToCard(11)" class="text-[11px] font-semibold bg-stone-100 hover:bg-stone-200 text-stone-700 px-3 py-1.5 rounded-full transition">Done</button>
                            </div>
                        </div>

                        <div class="space-y-3 mb-8">
                            <h3 class="text-xs font-semibold text-stone-400 uppercase tracking-wider mb-2">Manage Users</h3>
                            ${FRIENDS.map(name => {
                                const existing = allResponses.find(r => r.name === name);
                                const hasData = existing && existing.answers && Object.keys(existing.answers).length > 0;
                                return `
                                    <div class="flex items-center justify-between bg-stone-50 p-3 rounded-xl border border-stone-100">
                                        <div class="flex flex-col">
                                            <span class="text-sm font-semibold text-stone-800">${name}</span>
                                            <span class="text-[10px] text-stone-500 mt-0.5">${hasData ? 'Answers submitted' : 'Not started'}</span>
                                        </div>
                                        <button 
                                            onclick="window.wipeUser('${name}')"
                                            class="px-3 py-2 rounded-lg text-[11px] font-bold transition-all uppercase tracking-wide ${hasData ? 'bg-rose-100 text-rose-700 hover:bg-rose-200 active:scale-95' : 'bg-stone-200 text-stone-400 cursor-not-allowed opacity-50'}"
                                            ${hasData ? '' : 'disabled'}
                                        >
                                            Reset
                                        </button>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <div class="pt-6 border-t border-stone-100">
                            <button 
                                onclick="window.relockReunion()"
                                class="w-full py-3.5 px-4 rounded-xl border border-stone-200 bg-white text-stone-700 hover:bg-stone-50 text-sm font-semibold transition active:scale-95 flex items-center justify-center gap-2 shadow-sm"
                            >
                                <span>🔒</span> Re-lock App for Everyone
                            </button>
                            <p class="text-[10px] text-center text-stone-400 mt-3 leading-relaxed max-w-xs mx-auto">This will immediately return all users to the start screen and re-lock the group answers.</p>
                        </div>
                    </div>
                `;
                return;
            }
        }

        window.handlePinSubmit = function(e) {
            e.preventDefault();
            const input = document.getElementById('pin-field');
            const err = document.getElementById('pin-error');
            if (input && input.value.trim() === SECRET_PIN) {
                triggerGlobalUnlock();
                currentCardIndex = 11;
                renderCurrentCard();
            } else {
                if (err) err.classList.remove('hidden');
                if (input) { input.value = ''; input.classList.add('border-rose-400'); }
            }
        };

        // --- UNLOCKED GROUP ANSWERS VIEWER ---
        function renderUnlockedFeed() {
            const stage = document.getElementById('card-stage');
            const allSlides = [];
            
            BASE_QUESTIONS.forEach((q, qIdx) => {
                FRIENDS.forEach(friend => {
                    const person = allResponses.find(r => r.name === friend);
                    const ans = person && person.answers ? person.answers[q.id] : '';
                    if (ans && ans.trim().length > 0) {
                        let dynamicTitle = q.title;
                        if (q.id === 'q4') {
                            const target = Q4_ASSIGNMENTS[friend] || 'their friend';
                            dynamicTitle = `What 3 words would you use to describe ${target}?`;
                        }
                        allSlides.push({
                            questionNum: qIdx + 1,
                            questionTitle: dynamicTitle,
                            friend: friend,
                            text: ans
                        });
                    }
                });
            });

            if (unlockedViewMode === 'story') {
                if (allSlides.length === 0) {
                    stage.innerHTML = `
                        <div class="bg-white rounded-3xl p-8 shadow-sm border border-stone-200/70 text-center card-transition card-enter">
                            <h3 class="text-lg font-serif font-medium text-stone-900 mb-1">Waiting for Answers</h3>
                            <p class="text-xs text-stone-500 mb-6">No one has submitted answers to the cloud yet.</p>
                            <div class="flex flex-col gap-3 max-w-[200px] mx-auto">
                                <button onclick="window.goToCard(1)" class="text-xs font-semibold text-stone-800 underline">Add My Answers</button>
                                <button onclick="window.goToCard(0)" class="text-[10px] uppercase tracking-widest font-semibold text-stone-400 mt-2">Home</button>
                                <button onclick="window.goToAdmin()" class="text-[10px] uppercase tracking-widest font-semibold text-stone-400">⚙️ Admin</button>
                            </div>
                        </div>
                    `;
                    return;
                }

                if (unlockedStoryIdx >= allSlides.length) unlockedStoryIdx = 0;
                const slide = allSlides[unlockedStoryIdx];

                stage.innerHTML = `
                    <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-stone-200/70 card-transition card-enter flex flex-col justify-between min-h-[440px]">
                        <div>
                            <div class="flex items-center justify-between mb-4 text-xs">
                                <span class="text-stone-400 font-semibold tracking-wider uppercase text-[10px] sm:text-[11px]">Q${slide.questionNum} • ${slide.friend}</span>
                                <div class="flex items-center gap-2 sm:gap-3">
                                    <button onclick="window.goToCard(0)" class="text-stone-400 hover:text-stone-700 font-medium text-[10px] sm:text-[11px]">Home</button>
                                    <button onclick="window.goToAdmin()" class="text-stone-400 hover:text-stone-700 font-medium text-[10px] sm:text-[11px]">Manage</button>
                                    <button onclick="window.toggleUnlockedView('digest')" class="text-stone-400 hover:text-stone-700 font-medium text-[10px] sm:text-[11px]">List</button>
                                </div>
                            </div>

                            <h3 class="text-sm sm:text-base font-sans font-medium text-stone-500 mb-6 leading-snug">${slide.questionTitle}</h3>
                            <div class="my-3 py-2"><p class="text-lg sm:text-xl font-serif italic text-stone-800 leading-relaxed">"${escapeHtml(slide.text)}"</p></div>
                        </div>

                        <div class="pt-5 mt-4 border-t border-stone-100 flex items-center justify-between">
                            <button onclick="window.prevStorySlide()" class="text-xs font-semibold text-stone-500 hover:text-stone-800 px-3 py-2 transition disabled:opacity-30" ${unlockedStoryIdx === 0 ? 'disabled' : ''}>Prev</button>
                            <span class="text-[11px] font-mono text-stone-400">${unlockedStoryIdx + 1} / ${allSlides.length}</span>
                            <button onclick="window.nextStorySlide()" class="text-xs font-semibold bg-stone-900 hover:bg-stone-800 text-white px-5 py-2 rounded-full transition active:scale-95 disabled:opacity-30" ${unlockedStoryIdx === allSlides.length - 1 ? 'disabled' : ''}>Next</button>
                        </div>
                    </div>
                `;
            } else {
                stage.innerHTML = `
                    <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-stone-200/70 card-transition card-enter max-h-[75vh] overflow-y-auto">
                        <div class="flex items-center justify-between mb-6 pb-2 border-b border-stone-100 sticky top-0 bg-white z-10 pt-2">
                            <h3 class="text-base font-serif font-medium text-stone-900">All Answers</h3>
                            <div class="flex items-center gap-2 sm:gap-3">
                                <button onclick="window.goToCard(0)" class="text-xs text-stone-400 font-semibold hover:text-stone-700">Home</button>
                                <button onclick="window.goToAdmin()" class="text-xs text-stone-400 font-semibold hover:text-stone-700">Manage</button>
                                <button onclick="window.toggleUnlockedView('story')" class="text-xs text-stone-500 font-semibold hover:text-stone-800">Story</button>
                            </div>
                        </div>

                        <div class="space-y-6">
                            ${BASE_QUESTIONS.map((q, idx) => {
                                const answersForQ = FRIENDS.map(f => {
                                    const p = allResponses.find(r => r.name === f);
                                    return { friend: f, ans: p && p.answers ? p.answers[q.id] : null };
                                }).filter(item => item.ans && item.ans.trim().length > 0);

                                if (answersForQ.length === 0) return '';

                                return `
                                    <div class="space-y-2">
                                        <div class="text-[11px] font-semibold text-stone-400 uppercase tracking-wider">Question ${idx + 1}</div>
                                        <h4 class="text-sm font-semibold text-stone-800">${q.id === 'q4' ? 'What 3 words would you use to describe your assigned friend?' : q.title}</h4>
                                        <div class="space-y-2 pt-1">
                                            ${answersForQ.map(item => `
                                                <div class="bg-stone-50/80 rounded-xl p-3 border border-stone-100 text-xs sm:text-sm">
                                                    <span class="font-bold text-stone-900 text-xs block mb-0.5">${item.friend}:</span>
                                                    <p class="font-serif italic text-stone-700 leading-relaxed">${escapeHtml(item.ans)}</p>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }
        }

        window.toggleUnlockedView = function(mode) {
            unlockedViewMode = mode;
            renderUnlockedFeed();
        };

        window.nextStorySlide = function() { unlockedStoryIdx++; renderUnlockedFeed(); };
        window.prevStorySlide = function() { if (unlockedStoryIdx > 0) { unlockedStoryIdx--; renderUnlockedFeed(); } };

        // --- MOBILE SWIPE GESTURES ---
        function attachCardSwipeListener() {
            const card = document.getElementById('touch-card');
            if (!card) return;

            card.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: true });

            card.addEventListener('touchend', (e) => {
                const diffX = e.changedTouches[0].screenX - touchStartX;
                const diffY = e.changedTouches[0].screenY - touchStartY;

                if (Math.abs(diffX) > 45 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
                    if (diffX < 0) window.nextCard();
                    else window.prevCard();
                }
            }, { passive: true });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // --- INIT ---
        initAuth();
        renderCurrentCard();
    </script>
</body>
</html>
